[tool.poetry]
name = "waterone-data-engine"
version = "0.1.0"
description = "WaterOne Data Engine - Zero-cost local water quality lakehouse and telemetry platform"
authors = ["WaterOne Engineering <data@waterone.org>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
duckdb = ">=1.0.0"
pyarrow = ">=15.0.0"
pandas = ">=2.2.0"
pandera = {extras = ["pandas"], version = ">=0.20.0"}
pyyaml = ">=6.0"
pdfplumber = ">=0.11.0"
requests = ">=2.31.0"
scikit-learn = ">=1.4.0"
numpy = ">=1.26.0"
click = ">=8.1.0"
rich = ">=13.7.0"
streamlit = ">=1.35.0"
watchdog = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.poetry.scripts]
waterpipe = "src.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

